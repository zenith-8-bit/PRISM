version: '3.8'

services:
  # Main backend server
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: privacy-vision-agent
    ports:
      - "8000:8000"
    environment:
      # API Configuration
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - FLASK_DEBUG=${FLASK_DEBUG:-false}
      - PORT=8000
      - HOST=0.0.0.0
      
      # Connection URLs
      - BACKEND_URL=http://localhost:8000
      - WS_URL=ws://localhost:8000
      
      # Extension settings
      - CONFIG_DEBUG=${CONFIG_DEBUG:-false}
      - MIN_INFERENCE_INTERVAL_MS=1000
      - REDACTION_STYLE=blur
      
      # PII Redaction
      - WARN_ON_PII=true
      - ALWAYS_REDACT_EMAILS=true
      
      # Feature flags
      - ENABLE_IMAGE_CLASSIFICATION=true
      - ENABLE_WEBSOCKET=true
      - ENABLE_ACTION_CHAINING=true
      - ENABLE_PII_VAULT=true
    
    volumes:
      # Session data persistence (optional)
      - ./sessions:/app/sessions
      # Logs persistence (optional)
      - ./logs:/app/logs
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    networks:
      - agent-network
    
    depends_on:
      - redis

  # Redis for session storage (optional but recommended)
  redis:
    image: redis:7-alpine
    container_name: privacy-vision-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx reverse proxy for HTTPS and load balancing (optional)
  nginx:
    image: nginx:alpine
    container_name: privacy-vision-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - agent-network

networks:
  agent-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
